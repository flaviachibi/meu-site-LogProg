<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex2 </title>
    <style>
        body {
            background-color: aquamarine;

        }
    </style>
</head>

<body>
    <!--palcar de um jogo-->
    <p> Contador: <span id="contador">0</span></p>

    <button id="remover">Remover</button>
    <button id="add"> Add </button>

    <script>
        //1 etapa - seleciona elementos
        const contador = document.querySelector("#contador")
        const botaoRemover = document.querySelector("#remover")
        const botaoAdd = document.querySelector("#add")

        //2 etapa difinir as funçoes
        let qtidade = 0

        function add() {
            qtidade++
            contador.textContent = qtidade
        }

        function remover() {
            if (qtidade >= 1) {
                qtidade--
                contador.textContent = qtidade
            }
        }

        //3 etapa conectar as funççoes no evento do clique
        botaoAdd.addEventListener("click", add)
        botaoRemover.addEventListener("click", remover)

    </script>



</body>

</html>
